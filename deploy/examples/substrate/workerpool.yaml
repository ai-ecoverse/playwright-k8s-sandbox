# Kubernetes resource for substrate v0.5. Build ATEOM_IMAGE from that release:
# KO_DOCKER_REPO=YOUR_REGISTRY ko publish ./cmd/ateom-gvisor
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: playwright-workerpool
  namespace: NAMESPACE
  labels:
    workload: playwright
spec:
  replicas: 2
  workerImage: ATEOM_IMAGE
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: "1", memory: 1Gi }
