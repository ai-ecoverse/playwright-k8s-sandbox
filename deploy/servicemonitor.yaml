# Prometheus Operator ServiceMonitor for scraping the proxy's /metrics endpoint.
# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1). If you scrape
# with a plain Prometheus using pod annotations instead, you don't need this —
# the prometheus.io/* annotations on the Deployment pod template cover that case.
#
# Substitute NAMESPACE. The `release` label usually must match your Prometheus
# Operator's serviceMonitorSelector (commonly the Helm release name, e.g.
# `kube-prometheus-stack`); adjust to your install.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: playwright-proxy
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: playwright-proxy
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: playwright-proxy
  endpoints:
    - port: mgmt
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
