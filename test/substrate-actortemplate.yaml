# Substrate v0.5 API resource, NOT a Kubernetes CRD.
metadata:
  name: NAME
  atespace: NAMESPACE
workerSelector:
  matchLabels:
    workload: playwright
sandboxConfig:
  sandboxClass: gvisor
  configName: gvisor-default
containers:
  - name: whoami
    image: traefik/whoami:v1.10@sha256:1699d99cb4b9acc17f74ca670b3d8d0b7ba27c948b3445f0593b58ebece92f04
    command: ["/whoami"]
    wakeupProbe:
      httpGet: { path: /, port: 80 }
resources:
  limits:
    - { name: cpu, quantity: "1" }
    - { name: memory, quantity: 256Mi }
snapshotConfig:
  storageLocation: gs://ate-snapshots/playwright-NAME/
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
