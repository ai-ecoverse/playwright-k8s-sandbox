# Substrate v0.5 API resource, NOT a Kubernetes CRD.
# Apply with: kubectl-ate create actor-template -f FILE
metadata:
  name: NAME
  atespace: NAMESPACE
workerSelector:
  matchLabels:
    workload: playwright
sandboxConfig:
  sandboxClass: gvisor
  configName: gvisor-default
containers:
  - name: playwright
    image: PLAYWRIGHT_IMAGE
    command: ["node", "/server.js"]
    env:
      - { name: NODE_PATH, value: /usr/local/lib/node_modules }
      - { name: PLAYWRIGHT_BROWSERS_PATH, value: /ms-playwright }
      - { name: PORT, value: "80" }
      - { name: CHROMIUM_ARGS, value: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu" }
    wakeupProbe:
      httpGet: { path: /, port: 80 }
resources:
  limits:
    - { name: cpu, quantity: "1" }
    - { name: memory, quantity: 768Mi }
snapshotConfig:
  storageLocation: gs://ate-snapshots/playwright-NAME/
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
