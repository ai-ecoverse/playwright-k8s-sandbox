# isola v0.7 excludes private CIDRs even when allowInternetEgress is enabled.
# Permit only this run's HTTP fixture, not arbitrary cluster-internal traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: playwright-allow-test-target
  namespace: ISOLA_NAMESPACE
spec:
  podSelector:
    matchLabels:
      isola.run/sandbox: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: PROXY_NAMESPACE
          podSelector:
            matchLabels:
              app.kubernetes.io/name: test-target
      ports:
        - { protocol: TCP, port: 80 }
